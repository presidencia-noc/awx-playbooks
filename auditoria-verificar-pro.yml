---
- name: Vista previa de actualizaciones Linux
  hosts: all
  become: true
  gather_facts: yes

  tasks:

    - name: Actualizar índice APT
      apt:
        update_cache: yes
      changed_when: false
      failed_when: false

    - name: Obtener paquetes actualizables
      shell: |
        apt-get -s dist-upgrade 2>/dev/null | grep '^Inst ' || true
      register: updates
      changed_when: false
      failed_when: false

    - name: Contar paquetes
      shell: |
        apt-get -s dist-upgrade 2>/dev/null | grep '^Inst ' | wc -l
      register: update_count
      changed_when: false
      failed_when: false

    - name: Mostrar resumen
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "SO: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Actualizaciones pendientes: {{ update_count.stdout }}"
          - "Paquetes:"
          - "{{ updates.stdout_lines }}"
`
