---
- name: Auditoria Linux
  hosts: all
  gather_facts: yes
  become: yes

  tasks:

    - name: Verificar Ubuntu Pro
      command: pro status --format json
      register: pro_status
      changed_when: false
      failed_when: false

    - name: Verificar acceso a ESM
      shell: timeout 10 wget -q --spider https://esm.ubuntu.com
      register: esm_status
      changed_when: false
      failed_when: false

    - name: Verificar reinicio pendiente
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Contar actualizaciones disponibles
      shell: apt list --upgradable 2>/dev/null | tail -n +2 | wc -l
      register: upgradable
      changed_when: false
      failed_when: false

    - name: Mostrar resumen
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "SO: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Python: {{ ansible_python_version | default('Desconocido') }}"
          - "Actualizaciones: {{ upgradable.stdout | default('0') }}"
          - "Reinicio pendiente: {{ reboot_required.stat.exists | ternary('SI','NO') }}"
          - "ESM accesible: {{ 'SI' if esm_status.rc == 0 else 'NO' }}"
          - "Ubuntu Pro: {{ 'OK' if pro_status.rc == 0 else 'SIN PRO O SIN CONECTIVIDAD' }}"
