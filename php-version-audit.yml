// ============================================================
// PREPARAR REPORTE PHP
// AWX -> n8n
//
// REPORTE:
//
// TABLA 1:
// Solo hosts Linux que tengan PHP instalado directamente.
//
// TABLA 2:
// Solo contenedores Docker que tengan PHP.
//
// Los contenedores sin PHP quedan excluidos.
// Los hosts sin PHP en el host y sin PHP en Docker no aparecen
// en las tablas, aunque siguen contando como hosts auditados.
// ============================================================


// ============================================================
// 1. ENTRADA
// ============================================================

const entrada = $input.first().json;
const datos = entrada.body ?? entrada;

const fechaAuditoria =
  datos.fecha_auditoria ||
  new Date().toISOString();

const hosts =
  Array.isArray(datos.hosts)
    ? datos.hosts
    : [];


// ============================================================
// 2. FUNCIONES AUXILIARES
// ============================================================

function texto(valor, defecto = 'N/A') {
  if (
    valor === undefined ||
    valor === null ||
    String(valor).trim() === ''
  ) {
    return defecto;
  }

  return String(valor).trim();
}


function escaparHtml(valor) {
  return String(valor ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}


// ============================================================
// 3. VALIDAR VERSION PHP
//
// Acepta, por ejemplo:
//
// 7.4
// 7.4.3
// 8.1.2
// 8.2.35
// 8.3.27
// 8.4.1
//
// Rechaza:
//
// NO INSTALADO
// NO PHP
// N/A
// NO DETERMINADO
// OCI runtime exec failed...
// sh: not found
// etc.
// ============================================================

function esVersionPhpValida(valor) {
  if (
    valor === undefined ||
    valor === null
  ) {
    return false;
  }

  const version =
    String(valor).trim();

  if (version === '') {
    return false;
  }

  return /^\d+\.\d+(?:\.\d+)?/.test(version);
}


// ============================================================
// 4. OBTENER RAMA PHP
// ============================================================

function obtenerRama(version) {
  if (!esVersionPhpValida(version)) {
    return 'N/A';
  }

  const coincidencia =
    String(version)
      .trim()
      .match(/^(\d+)\.(\d+)/);

  if (!coincidencia) {
    return 'N/A';
  }

  return `${coincidencia[1]}.${coincidencia[2]}`;
}


// ============================================================
// 5. PHP INSTALADO EN EL HOST
// ============================================================

function obtenerPhpHost(host) {
  const version =
    texto(
      host.php_host_version,
      ''
    );

  if (esVersionPhpValida(version)) {
    return version;
  }

  return null;
}


// ============================================================
// 6. PHP INSTALADO EN CONTENEDOR
// ============================================================

function obtenerPhpContenedor(contenedor) {
  const version =
    texto(
      contenedor?.php_version,
      ''
    );

  if (esVersionPhpValida(version)) {
    return version;
  }

  return null;
}


// ============================================================
// 7. OBTENER UNICAMENTE CONTENEDORES CON PHP
// ============================================================

function obtenerContenedoresPhp(host) {
  if (!Array.isArray(host?.contenedores)) {
    return [];
  }

  return host.contenedores.filter(
    contenedor =>
      obtenerPhpContenedor(contenedor) !== null
  );
}


// ============================================================
// 8. ORDENAR HOSTS ALFABETICAMENTE
// ============================================================

const hostsOrdenados =
  [...hosts].sort(
    (a, b) =>
      texto(
        a.hostname,
        a.inventory_hostname || ''
      ).localeCompare(
        texto(
          b.hostname,
          b.inventory_hostname || ''
        ),
        'es',
        {
          sensitivity: 'base'
        }
      )
  );


// ============================================================
// 9. SEPARAR HOSTS RELEVANTES
// ============================================================

// Hosts con PHP instalado directamente en Linux.

const hostsConPhp =
  hostsOrdenados.filter(
    host =>
      obtenerPhpHost(host) !== null
  );


// Hosts con por lo menos un contenedor con PHP.

const hostsConPhpDocker =
  hostsOrdenados.filter(
    host =>
      obtenerContenedoresPhp(host).length > 0
  );


// ============================================================
// 10. VARIABLES DE SALIDA
// ============================================================

const filasCsv = [];

let filasHostsHtml = '';
let filasDockerHtml = '';


// ============================================================
// 11. TABLA SUPERIOR
//
// SOLAMENTE HOSTS DONDE PHP ESTA INSTALADO EN LINUX
// ============================================================

for (const host of hostsConPhp) {
  const hostname =
    texto(
      host.hostname,
      host.inventory_hostname || 'DESCONOCIDO'
    );

  const ip =
    texto(
      host.ip,
      'NO DETECTADA'
    );

  const sistema =
    texto(
      host.sistema_operativo,
      'NO DETECTADO'
    );

  const phpHost =
    obtenerPhpHost(host);

  const ramaHost =
    obtenerRama(phpHost);


  // ----------------------------------------------------------
  // HTML
  // ----------------------------------------------------------

  filasHostsHtml += `
    <tr>

      <td style="border:1px solid #cccccc;padding:8px;">
        ${escaparHtml(hostname)}
      </td>

      <td style="border:1px solid #cccccc;padding:8px;">
        ${escaparHtml(ip)}
      </td>

      <td style="border:1px solid #cccccc;padding:8px;">
        ${escaparHtml(sistema)}
      </td>

      <td style="border:1px solid #cccccc;padding:8px;font-weight:bold;">
        ${escaparHtml(phpHost)}
      </td>

      <td style="border:1px solid #cccccc;padding:8px;">
        ${escaparHtml(ramaHost)}
      </td>

    </tr>
  `;


  // ----------------------------------------------------------
  // CSV
  //
  // Una fila independiente para el PHP instalado en el host.
  // ----------------------------------------------------------

  filasCsv.push({
    'Tipo':
      'PHP Host',

    'Host':
      hostname,

    'IP':
      ip,

    'Sistema operativo':
      sistema,

    'PHP host':
      phpHost,

    'Rama PHP host':
      ramaHost,

    'Contenedor':
      '',

    'Imagen Docker':
      '',

    'PHP contenedor':
      '',

    'Rama PHP contenedor':
      ''
  });
}


// ============================================================
// 12. TABLA INFERIOR
//
// SOLAMENTE CONTENEDORES DONDE PHP FUE DETECTADO
// ============================================================

for (const host of hostsConPhpDocker) {
  const hostname =
    texto(
      host.hostname,
      host.inventory_hostname || 'DESCONOCIDO'
    );

  const ip =
    texto(
      host.ip,
      'NO DETECTADA'
    );

  const sistema =
    texto(
      host.sistema_operativo,
      'NO DETECTADO'
    );

  // El host puede perfectamente no tener PHP.
  const phpHostDetectado =
    obtenerPhpHost(host);

  const phpHost =
    phpHostDetectado !== null
      ? phpHostDetectado
      : 'NO INSTALADO';

  const ramaHost =
    phpHostDetectado !== null
      ? obtenerRama(phpHostDetectado)
      : 'N/A';


  const contenedores =
    obtenerContenedoresPhp(host);


  for (const contenedor of contenedores) {
    const nombreContenedor =
      texto(
        contenedor.nombre,
        'SIN NOMBRE'
      );

    const imagen =
      texto(
        contenedor.imagen,
        'NO DETECTADA'
      );

    const phpContenedor =
      obtenerPhpContenedor(contenedor);

    const ramaContenedor =
      obtenerRama(
        phpContenedor
      );


    // --------------------------------------------------------
    // HTML
    // --------------------------------------------------------

    filasDockerHtml += `
      <tr>

        <td style="border:1px solid #cccccc;padding:8px;">
          ${escaparHtml(hostname)}
        </td>

        <td style="border:1px solid #cccccc;padding:8px;">
          ${escaparHtml(ip)}
        </td>

        <td style="border:1px solid #cccccc;padding:8px;">
          ${escaparHtml(sistema)}
        </td>

        <td style="border:1px solid #cccccc;padding:8px;font-weight:bold;">
          ${escaparHtml(nombreContenedor)}
        </td>

        <td style="border:1px solid #cccccc;padding:8px;">
          ${escaparHtml(imagen)}
        </td>

        <td style="border:1px solid #cccccc;padding:8px;font-weight:bold;color:#1f4e78;">
          ${escaparHtml(phpContenedor)}
        </td>

        <td style="border:1px solid #cccccc;padding:8px;">
          ${escaparHtml(ramaContenedor)}
        </td>

      </tr>
    `;


    // --------------------------------------------------------
    // CSV
    // --------------------------------------------------------

    filasCsv.push({
      'Tipo':
        'PHP Docker',

      'Host':
        hostname,

      'IP':
        ip,

      'Sistema operativo':
        sistema,

      'PHP host':
        phpHost,

      'Rama PHP host':
        ramaHost,

      'Contenedor':
        nombreContenedor,

      'Imagen Docker':
        imagen,

      'PHP contenedor':
        phpContenedor,

      'Rama PHP contenedor':
        ramaContenedor
    });
  }
}


// ============================================================
// 13. TABLAS VACIAS
// ============================================================

if (filasHostsHtml === '') {
  filasHostsHtml = `
    <tr>

      <td
        colspan="5"
        style="
          border:1px solid #cccccc;
          padding:12px;
          text-align:center;
          color:#666666;
        "
      >
        No se detectaron hosts Linux con PHP instalado directamente.
      </td>

    </tr>
  `;
}


if (filasDockerHtml === '') {
  filasDockerHtml = `
    <tr>

      <td
        colspan="7"
        style="
          border:1px solid #cccccc;
          padding:12px;
          text-align:center;
          color:#666666;
        "
      >
        No se detectaron contenedores Docker con PHP.
      </td>

    </tr>
  `;
}


// ============================================================
// 14. ESTADISTICAS
// ============================================================

const totalHostsAuditados =
  hostsOrdenados.length;


const totalHostsPhp =
  hostsConPhp.length;


const totalHostsDockerPhp =
  hostsConPhpDocker.length;


const totalContenedoresPhp =
  hostsConPhpDocker.reduce(
    (total, host) =>
      total +
      obtenerContenedoresPhp(host).length,
    0
  );


// ============================================================
// 15. FECHA
// ============================================================

let fechaLocal;

try {
  fechaLocal =
    new Date(fechaAuditoria)
      .toLocaleString(
        'es-AR',
        {
          timeZone:
            'America/Argentina/Buenos_Aires',

          dateStyle:
            'full',

          timeStyle:
            'medium'
        }
      );
} catch (error) {
  fechaLocal =
    String(fechaAuditoria);
}


let fechaArchivo;

try {
  fechaArchivo =
    new Date(fechaAuditoria)
      .toISOString()
      .slice(0, 10);
} catch (error) {
  fechaArchivo =
    new Date()
      .toISOString()
      .slice(0, 10);
}


// ============================================================
// 16. DATOS DEL CORREO
// ============================================================

const asuntoEmail =
  `Auditoría de versiones PHP - ${fechaArchivo}`;


const nombreArchivo =
  `auditoria_php_${fechaArchivo}.csv`;


// ============================================================
// 17. HTML COMPLETO DEL EMAIL
// ============================================================

const reporteHtml = `
