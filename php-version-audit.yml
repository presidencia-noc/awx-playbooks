      padding:25px;
    "
  >

    <p>
      <strong>Fecha de auditoría:</strong>
      ${escaparHtml(fechaLocal)}
    </p>


    <!-- =================================================== -->
    <!-- RESUMEN -->
    <!-- =================================================== -->

    <table
      role="presentation"
      style="
        width:100%;
        border-collapse:separate;
