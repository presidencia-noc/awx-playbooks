---
- name: Auditoria de versiones PHP en hosts Linux y contenedores Docker
  hosts: all
  gather_facts: true
  become: true

  vars:
    n8n_webhook_url: "https://n8n.presidencia.gob.ar/webhook/auditoria-php"

  tasks:

    # ============================================================
    # INFORMACION GENERAL DEL HOST
    # ============================================================

    - name: Inicializar informacion del servidor
      ansible.builtin.set_fact:
        auditoria_php:
          hostname: "{{ ansible_fqdn | default(ansible_hostname) }}"
          inventory_hostname: "{{ inventory_hostname }}"
          ip: >-
            {{
              ansible_default_ipv4.address
              | default(ansible_all_ipv4_addresses[0] | default('NO DETECTADA'))
            }}
          sistema_operativo: >-
            {{
              ansible_distribution
              ~ ' '
              ~ ansible_distribution_version
            }}
          php_host_version: "NO INSTALADO"
          php_host_rama: "N/A"
          docker_instalado: false
          contenedores: []

    # ============================================================
    # PHP DEL HOST
    # ============================================================

    - name: Detectar version y rama PHP en el host
      ansible.builtin.shell: |
        if command -v php >/dev/null 2>&1; then
          VERSION="$(php -r 'echo PHP_VERSION;' 2>/dev/null)"
          RAMA="$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;' 2>/dev/null)"
          printf '%s|%s\n' "$VERSION" "$RAMA"
        else
          printf '%s|%s\n' "NO INSTALADO" "N/A"
        fi
      args:
        executable: /bin/sh
      register: php_host_result
      changed_when: false
      failed_when: false

    - name: Guardar version y rama PHP del host
      ansible.builtin.set_fact:
        auditoria_php: >-
          {{
            auditoria_php
            | combine({
                'php_host_version':
                  (
                    php_host_result.stdout.split('|')[0]
                    | default('NO INSTALADO')
                  ),
                'php_host_rama':
                  (
                    php_host_result.stdout.split('|')[1]
                    | default('N/A')
                  )
              })
          }}

    # ============================================================
    # DOCKER
    # ============================================================

    - name: Comprobar si Docker esta instalado y operativo
      ansible.builtin.shell: |
        if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
          echo "SI"
        else
          echo "NO"
        fi
      args:
        executable: /bin/sh
      register: docker_result
      changed_when: false
      failed_when: false

    - name: Guardar estado de Docker
      ansible.builtin.set_fact:
        auditoria_php: >-
          {{
            auditoria_php
            | combine({
                'docker_instalado': docker_result.stdout == 'SI'
              })
          }}

    # ============================================================
    # CONTENEDORES DOCKER
    # ============================================================

    - name: Obtener contenedores Docker en ejecucion
      ansible.builtin.shell: |
        docker ps --format '{% raw %}{{.Names}}|{{.Image}}{% endraw %}'
      args:
        executable: /bin/sh
      register: docker_containers
      changed_when: false
      failed_when: false
      when: auditoria_php.docker_instalado | bool

    # ============================================================
    # PHP DENTRO DE CADA CONTENEDOR
    # ============================================================

    - name: Consultar PHP dentro de cada contenedor
      ansible.builtin.shell: |
        CONTAINER="{{ item.split('|')[0] }}"

        docker exec "$CONTAINER" sh -c '
          PHP_BIN=""

          if command -v php >/dev/null 2>&1; then
            PHP_BIN="$(command -v php)"
          elif [ -x /usr/local/bin/php ]; then
            PHP_BIN="/usr/local/bin/php"
          elif [ -x /usr/bin/php ]; then
            PHP_BIN="/usr/bin/php"
          fi

          if [ -n "$PHP_BIN" ]; then
            VERSION="$("$PHP_BIN" -r "echo PHP_VERSION;" 2>/dev/null)"
            RAMA="$("$PHP_BIN" -r "echo PHP_MAJOR_VERSION . \".\" . PHP_MINOR_VERSION;" 2>/dev/null)"
            printf "%s|%s\n" "$VERSION" "$RAMA"
          else
            printf "%s|%s\n" "NO INSTALADO" "N/A"
          fi
        '
      args:
        executable: /bin/sh
      loop: "{{ docker_containers.stdout_lines | default([]) }}"
      register: php_docker_result
      changed_when: false
      failed_when: false
      when:
        - auditoria_php.docker_instalado | bool
        - docker_containers.stdout_lines | default([]) | length > 0

    # ============================================================
    # INCORPORAR CONTENEDORES AL RESULTADO DEL HOST
    # ============================================================

    - name: Incorporar contenedores al reporte
      ansible.builtin.set_fact:
        auditoria_php: >-
          {{
            auditoria_php
            | combine({
                'contenedores':
                  auditoria_php.contenedores
                  +
                  [{
                    'nombre': item.item.split('|')[0],
                    'imagen': item.item.split('|')[1],
                    'php_version':
                      (
                        item.stdout.split('|')[0]
                        | default('NO DETERMINADO')
                      ),
                    'php_rama':
                      (
                        item.stdout.split('|')[1]
                        | default('N/A')
                      )
                  }]
              })
          }}
      loop: "{{ php_docker_result.results | default([]) }}"
      when:
        - item.item is defined
        - not item.skipped | default(false)

    # ============================================================
    # MOSTRAR RESULTADO INDIVIDUAL EN AWX
    # ============================================================

    - name: Mostrar resultado individual del host
      ansible.builtin.debug:
        msg:
          hostname: "{{ auditoria_php.hostname }}"
          ip: "{{ auditoria_php.ip }}"
          sistema_operativo: "{{ auditoria_php.sistema_operativo }}"
          php_host_version: "{{ auditoria_php.php_host_version }}"
          php_host_rama: "{{ auditoria_php.php_host_rama }}"
          docker_instalado: "{{ auditoria_php.docker_instalado }}"
          contenedores: "{{ auditoria_php.contenedores }}"

    # ============================================================
    # CONSOLIDACION
    # ============================================================

    - name: Consolidar resultados de todos los hosts
      ansible.builtin.set_fact:
        auditoria_php_consolidada: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars, 'auditoria_php')
            | select('defined')
            | list
          }}
      run_once: true
      delegate_to: localhost
      delegate_facts: true
      become: false

    # ============================================================
    # MOSTRAR INFORME CONSOLIDADO EN AWX
    # ============================================================

    - name: Mostrar cantidad de hosts auditados
      ansible.builtin.debug:
        msg: >-
          Auditoria PHP finalizada.
          Total de hosts incluidos:
          {{ hostvars['localhost']['auditoria_php_consolidada'] | length }}
      run_once: true
      delegate_to: localhost
      become: false

    # ============================================================
    # ENVIAR RESULTADO A N8N
    # ============================================================

    - name: Enviar informe consolidado al webhook de n8n
      ansible.builtin.uri:
        url: "{{ n8n_webhook_url }}"
        method: POST
        body_format: json
        headers:
          Content-Type: "application/json"
        body:
          fecha_auditoria: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          origen: "AWX"
          tipo_auditoria: "PHP"
          total_hosts: "{{ hostvars['localhost']['auditoria_php_consolidada'] | length }}"
          hosts: "{{ hostvars['localhost']['auditoria_php_consolidada'] }}"
        status_code:
          - 200
          - 201
          - 202
        return_content: true
        timeout: 60
        validate_certs: true
      register: respuesta_n8n
      run_once: true
      delegate_to: localhost
      become: false

    # ============================================================
    # CONFIRMACION
    # ============================================================

    - name: Mostrar respuesta del webhook n8n
      ansible.builtin.debug:
        msg:
          - "Informe enviado a n8n."
          - "HTTP Status: {{ respuesta_n8n.status }}"
          - "Respuesta: {{ respuesta_n8n.content | default('Sin contenido') }}"
      run_once: true
      delegate_to: localhost
      become: false
