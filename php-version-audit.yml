// ============================================================
// 18. EVITAR SALIDA VACIA
// ============================================================

if (filasCsv.length === 0) {
  filasCsv.push({
    'Tipo':
      'Sin PHP detectado',

    'Host':
      '',

    'IP':
      '',

    'Sistema operativo':
      '',

    'PHP host':
      '',

    'Rama PHP host':
      '',

    'Contenedor':
      '',

    'Imagen Docker':
      '',

    'PHP contenedor':
      '',

    'Rama PHP contenedor':
      ''
  });
}


// ============================================================
// 19. SALIDA PARA N8N
// ============================================================

return filasCsv.map(
  (fila, indice) => ({
    json: {
      ...fila,

      reporte_html:
        reporteHtml,

      asunto_email:
        asuntoEmail,

      nombre_archivo:
        nombreArchivo,

      fecha_auditoria:
        fechaAuditoria,

      total_hosts:
        totalHostsAuditados,

      total_hosts_php:
        totalHostsPhp,

      total_hosts_php_docker:
        totalHostsDockerPhp,

      total_contenedores_php:
        totalContenedoresPhp,

      es_primera_fila:
        indice === 0
    }
  })
);
