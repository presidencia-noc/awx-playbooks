        margin-bottom:30px;
      "
    >

      <tr>

        <td
          style="
            width:25%;
            background:#e8f1f8;
            padding:18px;
            text-align:center;
          "
        >

          <div
            style="
              font-size:28px;
              font-weight:bold;
              color:#1f4e78;
            "
          >
            ${totalHostsAuditados}
          </div>

          <div style="font-size:13px;">
            Hosts auditados
          </div>

        </td>


        <td
          style="
            width:25%;
            background:#edf7ed;
            padding:18px;
            text-align:center;
          "
        >

          <div
            style="
              font-size:28px;
              font-weight:bold;
              color:#2e7d32;
