---
- name: Inventario de versiones PHP
  hosts: all
  gather_facts: false
  become: true

  tasks:

    - name: Obtener hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Detectar PHP en el host
      ansible.builtin.shell: |
        if command -v php >/dev/null 2>&1; then
          php -r 'echo PHP_VERSION;'
        else
          echo "NO INSTALADO"
        fi
      args:
        executable: /bin/sh
      register: php_host
      changed_when: false
      failed_when: false

    - name: Verificar si Docker esta instalado
      ansible.builtin.shell: |
        if command -v docker >/dev/null 2>&1; then
          echo "SI"
        else
          echo "NO"
        fi
      args:
        executable: /bin/sh
      register: docker_instalado
      changed_when: false

    - name: Obtener contenedores Docker en ejecucion
      ansible.builtin.shell: |
        docker ps --format '{% raw %}{{.Names}}|{{.Image}}{% endraw %}'
      args:
        executable: /bin/sh
      register: docker_containers
      changed_when: false
      failed_when: false
      when: docker_instalado.stdout == "SI"

    - name: Detectar PHP dentro de cada contenedor
      ansible.builtin.shell: |
        CONTAINER="{{ item.split('|')[0] }}"

        VERSION=$(docker exec "$CONTAINER" sh -c '
          if command -v php >/dev/null 2>&1; then
            php -r "echo PHP_VERSION;"
          elif [ -x /usr/local/bin/php ]; then
            /usr/local/bin/php -r "echo PHP_VERSION;"
          elif [ -x /usr/bin/php ]; then
            /usr/bin/php -r "echo PHP_VERSION;"
          else
            echo "NO PHP"
          fi
        ' 2>/dev/null)

        echo "$VERSION"
      args:
        executable: /bin/sh
      loop: "{{ docker_containers.stdout_lines | default([]) }}"
      register: php_docker
      changed_when: false
      failed_when: false
      when:
        - docker_instalado.stdout == "SI"
        - docker_containers.stdout_lines | default([]) | length > 0

    - name: REPORTE PHP DEL SERVIDOR
      ansible.builtin.debug:
        msg: |
          
          ============================================================
          REPORTE PHP
          ============================================================
          HOST: {{ hostname_result.stdout }}
          PHP HOST: {{ php_host.stdout }}
          DOCKER: {{ docker_instalado.stdout }}
          ------------------------------------------------------------
          {% if docker_instalado.stdout == "SI" %}
          {% if docker_containers.stdout_lines | default([]) | length > 0 %}
          CONTENEDORES:
          {% for container in docker_containers.stdout_lines %}
          {% set datos = container.split('|') %}
          {% set resultado = php_docker.results[loop.index0] if php_docker.results is defined else none %}
          
          Nombre : {{ datos[0] }}
          Imagen : {{ datos[1] }}
          PHP    : {{ resultado.stdout if resultado is not none else 'NO DETERMINADO' }}
          ------------------------------------------------------------
          {% endfor %}
          {% else %}
          No hay contenedores Docker en ejecucion.
          {% endif %}
          {% else %}
          Docker no instalado.
          {% endif %}
          ============================================================
