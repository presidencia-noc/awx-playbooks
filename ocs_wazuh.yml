---
- hosts: all
  become: true
  gather_facts: false

  vars:
    wazuh_version_objetivo: "4.14.7-1"
    wazuh_deb_url: "https://packages.wazuh.com/4.x/apt/pool/main/w/wazuh-agent/wazuh-agent_4.14.7-1_amd64.deb"

    ocs_url: "https://inventariolinux.presidencia.gob.ar/ocsinventory"

    ocs_cert_dir: "/var/lib/ocsinventory-agent/https:__inventariolinux.presidencia.gob.ar_ocsinventory"

  tasks:

    ##########################################################################
    # HOST
    ##########################################################################

    - name: Mostrar host
      debug:
        msg: "Procesando {{ inventory_hostname }}"

##############################################################################
# APT PROXY
##############################################################################

    - name: Verificar si existe 00aptproxy
      stat:
        path: /etc/apt/apt.conf.d/00aptproxy
      register: aptproxy

    - name: Comentar todas las lineas activas de 00aptproxy
      replace:
        path: /etc/apt/apt.conf.d/00aptproxy
        regexp: '^(?!#)(.*)$'
        replace: '# \1'
      when: aptproxy.stat.exists

    - name: Mostrar configuracion final del proxy
      command: cat /etc/apt/apt.conf.d/00aptproxy
      register: aptproxy_content
      changed_when: false
      when: aptproxy.stat.exists

    - name: Mostrar contenido del proxy
      debug:
        var: aptproxy_content.stdout_lines
      when: aptproxy.stat.exists

    ##########################################################################
    # MANEJO APT BLOQUEADO
    ##########################################################################

    - name: Detener unattended-upgrades
      service:
        name: unattended-upgrades
        state: stopped
      failed_when: false

    - name: Esperar liberacion de apt
      shell: |
        timeout=60

        while [ $timeout -gt 0 ]; do
          if ! fuser /var/lib/dpkg/lock >/dev/null 2>&1 && \
             ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 && \
             ! fuser /var/lib/apt/lists/lock >/dev/null 2>&1 && \
             ! fuser /var/cache/apt/archives/lock >/dev/null 2>&1; then
             exit 0
          fi

          sleep 5
          timeout=$((timeout-5))
        done

        exit 1
      register: apt_wait
      failed_when: false
      changed_when: false

    - name: Buscar procesos bloqueando apt
      shell: |
        (
          fuser /var/lib/dpkg/lock 2>/dev/null
          fuser /var/lib/dpkg/lock-frontend 2>/dev/null
          fuser /var/lib/apt/lists/lock 2>/dev/null
          fuser /var/cache/apt/archives/lock 2>/dev/null
        ) | tr ' ' '\n' | sort -u | grep -E '^[0-9]+$' || true
      register: apt_lock_pids
      changed_when: false
      when: apt_wait.rc != 0

    - name: Mostrar procesos bloqueando apt
      debug:
        var: apt_lock_pids.stdout_lines
      when: apt_wait.rc != 0

    - name: Finalizar procesos bloqueantes
      shell: |
        for pid in {{ apt_lock_pids.stdout_lines | join(' ') }}; do
          kill -9 "$pid" || true
        done
      when:
        - apt_wait.rc != 0
        - apt_lock_pids.stdout != ""
      failed_when: false

    - name: Eliminar locks residuales
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/dpkg/lock
        - /var/lib/dpkg/lock-frontend
        - /var/lib/apt/lists/lock
        - /var/cache/apt/archives/lock

    - name: Reconfigurar paquetes
      command: dpkg --configure -a
      failed_when: false

    - name: Reparar dependencias
      command: apt-get -f install -y
      failed_when: false

    ##########################################################################
    # OCS
    ##########################################################################

    - name: Detectar version OCS
      shell: |
        dpkg-query -W -f='${Version}' ocsinventory-agent 2>/dev/null || echo NOINSTALADO
      register: ocs_version
      changed_when: false

    - name: Mostrar version OCS
      debug:
        msg: "OCS={{ ocs_version.stdout }}"

    - name: Instalar o actualizar OCS
      apt:
        name: ocsinventory-agent
        state: latest
        update_cache: yes

    - name: Verificar configuracion OCS
      stat:
        path: /etc/ocsinventory/ocsinventory-agent.cfg
      register: ocs_cfg

    - name: Corregir server HTTP
      replace:
        path: /etc/ocsinventory/ocsinventory-agent.cfg
        regexp: '^server=http://inventariolinux\.presidencia\.gob\.ar/ocsinventory'
        replace: 'server=https://inventariolinux.presidencia.gob.ar/ocsinventory'
      when: ocs_cfg.stat.exists

    - name: Corregir modo local
      replace:
        path: /etc/ocsinventory/ocsinventory-agent.cfg
        regexp: '^local=/var/lib/ocsinventory-agent/reports'
        replace: 'server=https://inventariolinux.presidencia.gob.ar/ocsinventory'
      when: ocs_cfg.stat.exists

    - name: Crear directorio certificado OCS
      file:
        path: "{{ ocs_cert_dir }}"
        state: directory
        mode: "0755"

    - name: Eliminar certificado viejo
      file:
        path: "{{ ocs_cert_dir }}/cacert.pem"
        state: absent

    - name: Descargar certificado OCS
      shell: |
        openssl s_client \
          -connect inventariolinux.presidencia.gob.ar:443 \
          -servername inventariolinux.presidencia.gob.ar \
          -showcerts </dev/null 2>/dev/null \
          | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/' \
          > "{{ ocs_cert_dir }}/cacert.pem"
      args:
        executable: /bin/bash

    - name: Validar certificado
      command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ ocs_cert_dir }}/cacert.pem"
          - -noout
      register: cert_check
      failed_when: false
      changed_when: false

    - name: Mostrar validacion certificado
      debug:
        var: cert_check.rc

    - name: Mostrar configuracion OCS
      shell: grep -E 'server=|local=' /etc/ocsinventory/ocsinventory-agent.cfg
      register: ocs_cfg_final
      failed_when: false
      changed_when: false

    - debug:
        var: ocs_cfg_final.stdout_lines

    - name: Ejecutar inventario OCS
      command: ocsinventory-agent --debug
      register: ocs_result
      failed_when: false

    ##########################################################################
    # WAZUH
    ##########################################################################

    - name: Detectar version Wazuh
      shell: |
        dpkg-query -W -f='${Version}' wazuh-agent 2>/dev/null || echo NOINSTALADO
      register: wazuh_version
      changed_when: false

    - name: Mostrar version Wazuh
      debug:
        msg: "Wazuh={{ wazuh_version.stdout }}"

    - name: Descargar Wazuh
      get_url:
        url: "{{ wazuh_deb_url }}"
        dest: /tmp/wazuh-agent_4.14.7-1_amd64.deb
      when: >
        wazuh_version.stdout == "NOINSTALADO"
        or
        wazuh_version_objetivo not in wazuh_version.stdout

    - name: Instalar o actualizar Wazuh
      shell: |
        WAZUH_MANAGER='172.21.205.100' \
        dpkg -i /tmp/wazuh-agent_4.14.7-1_amd64.deb
      when: >
        wazuh_version.stdout == "NOINSTALADO"
        or
        wazuh_version_objetivo not in wazuh_version.stdout

    - name: Recargar systemd
      command: systemctl daemon-reload
      changed_when: false

    - name: Habilitar Wazuh
      systemd:
        name: wazuh-agent
        enabled: true

    - name: Iniciar Wazuh
      systemd:
        name: wazuh-agent
        state: started

    - name: Verificar estado Wazuh
      command: systemctl is-active wazuh-agent
      register: wazuh_estado
      changed_when: false
      failed_when: false

    ##########################################################################
    # RESUMEN
    ##########################################################################

    - name: Mostrar resumen
      debug:
        msg:
          - "OCS={{ ocs_version.stdout }}"
          - "WAZUH={{ wazuh_version.stdout }}"
          - "ESTADO_WAZUH={{ wazuh_estado.stdout }}"
