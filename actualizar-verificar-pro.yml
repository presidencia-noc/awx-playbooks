---
- name: Auditoria Linux
  hosts: all
  gather_facts: yes
  become: yes

  tasks:

    - name: Obtener release Ubuntu
      shell: lsb_release -ds 2>/dev/null || cat /etc/os-release | grep PRETTY_NAME= | cut -d= -f2
      register: ubuntu_release
      changed_when: false
      failed_when: false

    - name: Verificar Ubuntu Pro
      shell: |
        if command -v pro >/dev/null 2>&1; then
          pro status --format json 2>/dev/null
        else
          echo '{"result":"NO_PRO"}'
        fi
      register: pro_status
      changed_when: false
      failed_when: false

    - name: Verificar acceso a ESM
      shell: wget -q --spider https://esm.ubuntu.com
      register: esm_status
      changed_when: false
      failed_when: false

    - name: Verificar reinicio pendiente
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Actualizar índices APT
      apt:
        update_cache: yes
      register: apt_update
      changed_when: false
      failed_when: false

    - name: Contar actualizaciones disponibles
      shell: |
        apt list --upgradable 2>/dev/null | tail -n +2 | wc -l
      register: upgradable
      changed_when: false
      failed_when: false

    - name: Mostrar resumen
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "SO: {{ ubuntu_release.stdout }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Python: {{ ansible_python.version.full }}"
          - "Actualizaciones disponibles: {{ upgradable.stdout | default('0') }}"
          - "Reinicio pendiente: {{ reboot_required.stat.exists | ternary('SI','NO') }}"
          - "ESM accesible: {{ esm_status.rc == 0 | ternary('SI','NO') }}"
          - "Ubuntu Pro: {{ 'SI' if 'success' in pro_status.stdout else 'NO o SIN CONECTIVIDAD' }}"
