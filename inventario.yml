---
############################################################
# Crear archivo CSV
############################################################

- name: Preparar CSV
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Crear cabecera CSV
      copy:
        dest: /runner/artifacts/inventario.csv
        content: |
          HOST;IP;SO;VERSION;PYTHON;OCS;WAZUH;ESTADO

############################################################
# Inventario Linux
############################################################

- name: Inventario Linux
  hosts: all
  gather_facts: true
  ignore_unreachable: true

  tasks:

    - name: Detectar OCS
      shell: |
        command -v ocsinventory-agent >/dev/null 2>&1 && echo SI || echo NO
      register: ocs
      changed_when: false
      failed_when: false

    - name: Detectar Wazuh
      shell: |
        [ -d /var/ossec ] && echo SI || echo NO
      register: wazuh
      changed_when: false
      failed_when: false

    - name: Agregar fila CSV
      delegate_to: localhost
      become: false

      lineinfile:
        path: /runner/artifacts/inventario.csv
        insertafter: EOF

        line: >-
          {{ inventory_hostname }};
          {{ ansible_default_ipv4.address | default(ansible_host | default('SIN_IP')) }};
          {{ ansible_distribution | default('DESCONOCIDO') }};
          {{ ansible_distribution_version | default('N/D') }};
          {{ ansible_python_version | default('N/D') }};
          {{ ocs.stdout | default('NO') }};
          {{ wazuh.stdout | default('NO') }};
          OK

############################################################
# Hosts sin facts o inaccesibles
############################################################

- name: Hosts con problemas
  hosts: all
  gather_facts: false
  ignore_unreachable: true

  tasks:

    - name: Registrar host con error
      delegate_to: localhost
      become: false

      lineinfile:
        path: /runner/artifacts/inventario.csv
        insertafter: EOF

        line: >-
          {{ inventory_hostname }};
          {{ ansible_host | default('SIN_IP') }};
          DESCONOCIDO;
          N/D;
          N/D;
          NO;
          NO;
          ERROR_CONEXION

      when:
        - hostvars[inventory_hostname].ansible_distribution is not defined
