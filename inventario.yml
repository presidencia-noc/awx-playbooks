---
- name: Inventario Linux AWX
  hosts: all
  gather_facts: true
  ignore_unreachable: true

  tasks:

    - name: Crear CSV con cabecera
      run_once: true
      delegate_to: localhost
      become: false

      copy:
        dest: /tmp/inventario.csv
        content: |
          HOST;IP;SO;VERSION;PYTHON;OCS;WAZUH;ESTADO

    - name: Detectar OCS
      shell: |
        command -v ocsinventory-agent >/dev/null 2>&1 && echo SI || echo NO
      register: ocs
      changed_when: false
      failed_when: false

    - name: Detectar Wazuh
      shell: |
        [ -d /var/ossec ] && echo SI || echo NO
      register: wazuh
      changed_when: false
      failed_when: false

    - name: Agregar fila CSV
      delegate_to: localhost
      become: false

      lineinfile:
        path: /tmp/inventario.csv
        insertafter: EOF

        line: >-
          {{ inventory_hostname }};
          {{ ansible_default_ipv4.address | default(ansible_host | default('SIN_IP')) }};
          {{ ansible_distribution | default('DESCONOCIDO') }};
          {{ ansible_distribution_version | default('N/D') }};
          {{ ansible_python_version | default('N/D') }};
          {{ ocs.stdout | default('NO') }};
          {{ wazuh.stdout | default('NO') }};
          OK

    - name: Mostrar ubicación del CSV
      run_once: true
      delegate_to: localhost
      debug:
        msg: "CSV generado en /tmp/inventario.csv"
