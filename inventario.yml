---
- name: Inventario Linux CSV
  hosts: all
  gather_facts: true
  ignore_unreachable: true

  tasks:

    - name: Detectar OCS
      shell: |
        command -v ocsinventory-agent >/dev/null 2>&1 && echo SI || echo NO
      register: ocs
      changed_when: false
      failed_when: false

    - name: Detectar Wazuh
      shell: |
        [ -d /var/ossec ] && echo SI || echo NO
      register: wazuh
      changed_when: false
      failed_when: false

    - name: Agregar host a la lista
      set_fact:
        csv_line: >-
          {{ inventory_hostname }};
          {{ ansible_default_ipv4.address | default(ansible_host | default('SIN_IP')) }};
          {{ ansible_distribution }};
          {{ ansible_distribution_version }};
          {{ ansible_python_version | default('N/D') }};
          {{ ocs.stdout }};
          {{ wazuh.stdout }};
          OK

    - name: Guardar línea
      set_stats:
        data:
          hosts_csv: "{{ (ansible_stats.data.hosts_csv | default([])) + [csv_line] }}"
