---
- name: Inventario Linux AWX
  hosts: all
  gather_facts: true
  ignore_unreachable: true

  tasks:

    - name: Detectar OCS
      shell: |
        command -v ocsinventory-agent >/dev/null 2>&1 && echo SI || echo NO
      register: ocs
      changed_when: false
      failed_when: false

    - name: Detectar Wazuh
      shell: |
        [ -d /var/ossec ] && echo SI || echo NO
      register: wazuh
      changed_when: false
      failed_when: false

    - name: Construir línea CSV
      set_fact:
        csv_line: >-
          {{ inventory_hostname }};
          {{ ansible_default_ipv4.address | default(ansible_host | default('SIN_IP')) }};
          {{ ansible_distribution | default('DESCONOCIDO') }};
          {{ ansible_distribution_version | default('N/D') }};
          {{ ansible_python_version | default('N/D') }};
          {{ ocs.stdout | default('NO') }};
          {{ wazuh.stdout | default('NO') }};
          OK

    - name: Consolidar resultados
      set_stats:
        aggregate: true
        data:
          inventario_lineas:
            - "{{ csv_line }}"

    - name: Mostrar CSV completo en el Job
      run_once: true
      delegate_to: localhost
      debug:
        msg: |
          HOST;IP;SO;VERSION;PYTHON;OCS;WAZUH;ESTADO
          {% for h in ansible_play_hosts_all %}
          {% if hostvars[h].csv_line is defined %}
          {{ hostvars[h].csv_line }}
          {% endif %}
          {% endfor %}
