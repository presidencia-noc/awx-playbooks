---
########################################################################
# AUDITORIA
########################################################################

- name: Auditoria Linux
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  ignore_unreachable: true

  tasks:
    - name: Inicializar estado por defecto
      set_fact:
        estado_awx: "UNREACHABLE"
        motivo_awx: "Host no accesible"
        updates_count: 0

    - block:
        - name: Recolectar facts
          setup:

        - name: Validar si es Debian u Ubuntu
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "Sistema operativo no soportado (No es Debian/Ubuntu)"
          when: ansible_os_family is not defined or ansible_os_family != "Debian"

        # Solo continuar si pasó la validación de OS
        - block:
            - name: Host accesible y validado
              set_fact:
                estado_awx: "OK"
                motivo_awx: ""

            - name: Actualizar cache apt
              shell: apt-get update
              changed_when: false

            - name: Detectar actualizaciones
              shell: |
                apt-get --simulate dist-upgrade 2>/dev/null | grep '^Inst ' || true
              register: updates_preview
              changed_when: false
              failed_when: false

            - name: Contar actualizaciones
              set_fact:
                updates_count: "{{ updates_preview.stdout_lines | length | default(0) }}"

            - name: Detectar reboot requerido
              stat:
                path: /var/run/reboot-required
              register: reboot_required

            - name: Marcar reboot
              set_fact:
                estado_awx: "REBOOT"
                motivo_awx: "Reinicio pendiente"
              when: reboot_required.stat.exists | default(false)
          when: estado_awx != "ERROR"

      rescue:
        - name: Registrar error en caso de fallo de comandos
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "{{ ansible_failed_result.msg | default('Error no especificado en la ejecución') }}"

########################################################################
# CONSOLIDACION Y ENVIO A N8N
########################################################################

- name: Consolidar resultados y enviar a n8n
  hosts: localhost
  gather_facts: false
  become: false

  tasks:
    - name: Definir hosts ejecutados
      set_fact:
        hosts_ejecutados: "{{ groups['all'] | difference(['localhost']) }}"

    - name: Calcular Totales de Estados
      set_fact:
        total_ok: "{{ hosts_ejecutados | map('extract', hostvars) | selectattr('estado_awx', 'defined') | selectattr('estado_awx', '==', 'OK') | list | length }}"
        total_reboot: "{{ hosts_ejecutados | map('extract', hostvars) | selectattr('estado_awx', 'defined') | selectattr('estado_awx', '==', 'REBOOT') | list | length }}"
        total_error: "{{ hosts_ejecutados | map('extract', hostvars) | selectattr('estado_awx', 'defined') | selectattr('estado_awx', '==', 'ERROR') | list | length }}"
        total_hosts: "{{ hosts_ejecutados | length }}"

    - name: Total unreachable
      set_fact:
        total_unreachable: "{{ total_hosts | int - total_ok | int - total_reboot | int - total_error | int }}"

    - name: Construir JSON de servidores eficientemente
      set_fact:
        servidores_awx: >-
          {% set lista = [] %}
          {% for item in hosts_ejecutados %}
            {% set hvar = hostvars[item] %}
            {% set estado = hvar.estado_awx | default('UNREACHABLE') %}
            {% set info_os = (hvar.ansible_distribution | default('N/D')) ~ ' ' ~ (hvar.ansible_distribution_version | default('')) %}
            {% set _ = lista.append({
              'host': item,
              'ip': hvar.ansible_host | default(item),
              'os': info_os if estado != 'UNREACHABLE' else 'N/D',
              'kernel': hvar.ansible_kernel | default('N/D'),
              'updates': hvar.updates_count | default(0) | int,
              'estado': estado,
              'motivo': hvar.motivo_awx | default('') if estado != 'OK' else ''
            }) %}
          {% endfor %}
          {{ lista }}

    - name: Mostrar resumen en logs de AWX
      debug:
        msg:
          - "TOTAL HOSTS={{ total_hosts }}"
          - "OK={{ total_ok }}"
          - "REBOOT={{ total_reboot }}"
          - "ERROR={{ total_error }}"
          - "UNREACHABLE={{ total_unreachable }}"

    - name: Enviar Payload a N8N
      uri:
        url: "https://n8n.presidencia.gob.ar/webhook/awx-auditoria"
        method: POST
        body_format: json
        validate_certs: false
        return_content: true
        timeout: 60
        body:
          fecha: "{{ lookup('pipe', 'date +%Y-%m-%d_%H:%M:%S') }}"
          resumen:
            total_hosts: "{{ total_hosts | int }}"
            ok: "{{ total_ok | int }}"
            reboot: "{{ total_reboot | int }}"
            error: "{{ total_error | int }}"
            unreachable: "{{ total_unreachable | int }}"
          servidores: "{{ servidores_awx }}"
      register: webhook_result

    - name: Resultado webhook
      debug:
        var: webhook_result.status
