---
- name: Auditoria Linux y envio a n8n
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  ignore_unreachable: true

  tasks:

    - name: Inicializar estado
      set_fact:
        estado_awx: "UNREACHABLE"
        motivo_awx: "Host no accesible"
        updates_count: 0
        cacheable: true

    - block:

        - name: Recolectar facts
          setup:

        - name: Marcar host accesible
          set_fact:
            estado_awx: "OK"
            motivo_awx: ""
            cacheable: true

        - name: Validar Debian
          meta: end_host
          when:
            - ansible_os_family is defined
            - ansible_os_family != "Debian"

        - name: Actualizar cache apt
          shell: apt-get update
          changed_when: false

        - name: Detectar actualizaciones pendientes
          shell: |
            apt-get --simulate dist-upgrade 2>/dev/null | grep '^Inst ' || true
          register: updates_preview
          changed_when: false
          failed_when: false

        - name: Contar actualizaciones
          set_fact:
            updates_count: "{{ updates_preview.stdout_lines | length }}"
            cacheable: true

        - name: Detectar reboot requerido
          stat:
            path: /var/run/reboot-required
          register: reboot_required

        - name: Marcar reboot
          set_fact:
            estado_awx: "REBOOT"
            motivo_awx: "Reinicio pendiente"
            cacheable: true
          when:
            - reboot_required.stat.exists | default(false)

      rescue:

        - name: Registrar error
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "{{ ansible_failed_result.msg | default('Error no especificado') }}"
            cacheable: true

    ####################################################################
    # CONSOLIDACION
    ####################################################################

    - name: Total OK
      run_once: true
      delegate_to: localhost
      set_fact:
        total_ok: >-
          {{
            groups['all']
            | map('extract', hostvars)
            | selectattr('estado_awx','defined')
            | selectattr('estado_awx','equalto','OK')
            | list
            | length
          }}

    - name: Total REBOOT
      run_once: true
      delegate_to: localhost
      set_fact:
        total_reboot: >-
          {{
            groups['all']
            | map('extract', hostvars)
            | selectattr('estado_awx','defined')
            | selectattr('estado_awx','equalto','REBOOT')
            | list
            | length
          }}

    - name: Total ERROR
      run_once: true
      delegate_to: localhost
      set_fact:
        total_error: >-
          {{
            groups['all']
            | map('extract', hostvars)
            | selectattr('estado_awx','defined')
            | selectattr('estado_awx','equalto','ERROR')
            | list
            | length
          }}

    - name: Total hosts
      run_once: true
      delegate_to: localhost
      set_fact:
        total_hosts: "{{ groups['all'] | length }}"

    - name: Total unreachable
      run_once: true
      delegate_to: localhost
      set_fact:
        total_unreachable: >-
          {{
            total_hosts | int
            - total_ok | int
            - total_reboot | int
            - total_error | int
          }}

    - name: Construir lista servidores
      run_once: true
      delegate_to: localhost
      set_fact:
        servidores_awx: >-
          {%- set lista = [] -%}
          {%- for host in groups['all'] -%}
          {%- set _ = lista.append({
            'host': host,
            'ip': hostvars[host].ansible_host | default('N/D'),
            'os': (
              hostvars[host].ansible_distribution | default('N/D')
            ) ~ ' ' ~ (
              hostvars[host].ansible_distribution_version | default('')
            ),
            'kernel': hostvars[host].ansible_kernel | default('N/D'),
            'updates': hostvars[host].updates_count | default(0),
            'estado': hostvars[host].estado_awx | default('UNREACHABLE'),
            'motivo': hostvars[host].motivo_awx | default('')
          }) -%}
          {%- endfor -%}
          {{ lista }}

    - name: Mostrar resumen
      run_once: true
      delegate_to: localhost
      debug:
        msg:
          - "TOTAL HOSTS={{ total_hosts }}"
          - "OK={{ total_ok }}"
          - "REBOOT={{ total_reboot }}"
          - "ERROR={{ total_error }}"
          - "UNREACHABLE={{ total_unreachable }}"
          - "SERVIDORES={{ servidores_awx | length }}"

    - name: Enviar a n8n
      run_once: true
      delegate_to: localhost
      uri:
        url: "https://n8n.presidencia.gob.ar/webhook/awx-auditoria"
        method: POST
        body_format: json
        validate_certs: false
        return_content: true
        timeout: 60

        body:
          fecha: "{{ lookup('pipe','date +%F_%T') }}"

          resumen:
            total_hosts: "{{ total_hosts | int }}"
            ok: "{{ total_ok | int }}"
            reboot: "{{ total_reboot | int }}"
            error: "{{ total_error | int }}"
            unreachable: "{{ total_unreachable | int }}"

          servidores: "{{ servidores_awx | from_yaml }}"

      register: webhook_result

    - name: Mostrar respuesta webhook
      run_once: true
      delegate_to: localhost
      debug:
        var: webhook_result.status
