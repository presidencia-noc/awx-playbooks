---
########################################################################
# AUDITORIA DE SERVIDORES LINUX
########################################################################

- name: Auditoria General Linux para Reporte N8N
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  ignore_unreachable: true

  tasks:
    - name: Inicializar valores por defecto (Fallo/No accesible)
      set_fact:
        estado_awx: "UNREACHABLE"
        motivo_awx: "Host no accesible por SSH"
        updates_count: 0
        reboot_pendiente: "No"

    - block:
        - name: Recolectar Facts del Sistema
          setup:

        - name: Validar Distribucion (Debian/Ubuntu)
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "SO no soportado (No es Debian/Ubuntu)"
          when: ansible_os_family is not defined or ansible_os_family != "Debian"

        # Si pasa la validación de SO, ejecuta la auditoría profunda
        - block:
            - name: Host accesible y validado
              set_fact:
                estado_awx: "OK"
                motivo_awx: "Operativo"

            - name: Actualizar cache de paquetes (apt)
              shell: apt-get update
              changed_when: false

            - name: Detectar actualizaciones pendientes
              shell: |
                apt-get --simulate dist-upgrade 2>/dev/null | grep '^Inst ' || true
              register: updates_preview
              changed_when: false
              failed_when: false

            - name: Contar actualizaciones
              set_fact:
                updates_count: "{{ updates_preview.stdout_lines | length | default(0) }}"

            - name: Detectar si requiere reinicio
              stat:
                path: /var/run/reboot-required
              register: reboot_required

            - name: Marcar estado de reinicio
              set_fact:
                reboot_pendiente: "Sí"
                estado_awx: "REBOOT"
                motivo_awx: "Reinicio pendiente"
              when: reboot_required.stat.exists | default(false)
          when: estado_awx != "ERROR"

      rescue:
        - name: Capturar errores internos en la ejecución
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "{{ ansible_failed_result.msg | default('Error desconocido en tareas') }}"

########################################################################
# CONSOLIDACION Y ENVIO A N8N
########################################################################

    - name: Consolidar y Enviar Webhook
      block:
        - name: Filtrar hosts reales del inventario
          set_fact:
            hosts_ejecutados: "{{ groups['all'] | difference(['localhost', '127.0.0.1']) }}"

        - name: Construir Listado Estructurado para la Tabla HTML
          set_fact:
            servidores_awx: >-
              {% set lista = [] %}
              {% for item in hosts_ejecutados %}
                {% set hvar = hostvars[item] %}
                {% set estado = hvar.estado_awx | default('UNREACHABLE') %}
                {% set _ = lista.append({
                  'nombre': item,
                  'ip': hvar.ansible_host | default(item),
                  'sistema_operativo': hvar.ansible_distribution | default('N/D'),
                  'version': hvar.ansible_distribution_version | default('N/D'),
                  'kernel': hvar.ansible_kernel | default('N/D'),
                  'updates_pendientes': hvar.updates_count | default(0) | int,
                  'reboot_pendiente': hvar.reboot_pendiente | default('No'),
                  'estado': estado,
                  'detalles': hvar.motivo_awx | default('')
                }) %}
              {% endfor %}
              {{ lista }}

        - name: Enviar Datos Limpios a N8N
          uri:
            url: "https://n8n.presidencia.gob.ar/webhook/awx-auditoria"
            method: POST
            body_format: json
            validate_certs: false
            return_content: true
            timeout: 45
            body:
              fecha_auditoria: "{{ lookup('pipe', 'date +%Y-%m-%d_%H:%M:%S') }}"
              servidores: "{{ servidores_awx }}"
          register: webhook_result

        - name: Log de respuesta de red
          debug:
            msg: "Webhook enviado a N8N. Código de estado recibido: {{ webhook_result.status }}"

      run_once: true
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
