---
- name: Auditoria Linux
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  ignore_unreachable: true

  tasks:

    - name: Inicializar estado
      set_fact:
        estado_awx: "UNREACHABLE"
        motivo_awx: "Host no accesible"
        updates_count: 0

    - block:

        - name: Recolectar facts
          setup:

        - name: Inicializar host accesible
          set_fact:
            estado_awx: "OK"
            motivo_awx: ""

        - name: Validar Debian Ubuntu
          meta: end_host
          when:
            - ansible_os_family is defined
            - ansible_os_family != "Debian"

        - name: Actualizar cache APT
          shell: apt-get update
          changed_when: false

        - name: Detectar actualizaciones pendientes
          shell: |
            apt-get --simulate dist-upgrade 2>/dev/null | grep '^Inst ' || true
          register: updates_preview
          changed_when: false
          failed_when: false

        - name: Contar actualizaciones
          set_fact:
            updates_count: "{{ updates_preview.stdout_lines | length }}"

        - name: Detectar reboot requerido
          stat:
            path: /var/run/reboot-required
          register: reboot_required

        - name: Marcar reinicio requerido
          set_fact:
            estado_awx: "REBOOT"
            motivo_awx: "Reinicio pendiente"
          when:
            - reboot_required.stat.exists | default(false)

      rescue:

        - name: Registrar error
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "{{ ansible_failed_result.msg | default('Error no especificado') }}"

########################################################################
# CONSOLIDACIÓN Y ENVÍO A N8N
########################################################################

- name: Consolidar resultados y enviar a n8n
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Calcular hosts OK
      set_fact:
        total_ok: >-
          {{
            groups['all']
            | map('extract', hostvars)
            | selectattr('estado_awx','defined')
            | selectattr('estado_awx','equalto','OK')
            | list
            | length
          }}

    - name: Calcular hosts REBOOT
      set_fact:
        total_reboot: >-
          {{
            groups['all']
            | map('extract', hostvars)
            | selectattr('estado_awx','defined')
            | selectattr('estado_awx','equalto','REBOOT')
            | list
            | length
          }}

    - name: Calcular hosts ERROR
      set_fact:
        total_error: >-
          {{
            groups['all']
            | map('extract', hostvars)
            | selectattr('estado_awx','defined')
            | selectattr('estado_awx','equalto','ERROR')
            | list
            | length
          }}

    - name: Calcular total hosts
      set_fact:
        total_hosts: "{{ groups['all'] | length }}"

    - name: Calcular hosts UNREACHABLE
      set_fact:
        total_unreachable: >-
          {{
            total_hosts | int
            - total_ok | int
            - total_reboot | int
            - total_error | int
          }}

    - name: Inicializar lista de servidores
      set_fact:
        servidores_awx: []

    - name: Agregar servidores al JSON
      set_fact:
        servidores_awx: >-
          {{
            servidores_awx +
            [
              {
                'host': item,
                'ip': hostvars[item].ansible_host | default('N/D'),
                'os': (
                  hostvars[item].ansible_distribution | default('N/D')
                ) ~ ' ' ~ (
                  hostvars[item].ansible_distribution_version | default('')
                ),
                'kernel': hostvars[item].ansible_kernel | default('N/D'),
                'updates': hostvars[item].updates_count | default(0),
                'estado': hostvars[item].estado_awx | default('UNREACHABLE'),
                'motivo': hostvars[item].motivo_awx | default('')
              }
            ]
          }}
      loop: "{{ groups['all'] }}"

    - name: Mostrar resumen
      debug:
        msg:
          - "==============================================="
          - "AUDITORIA LINUX"
          - "==============================================="
          - "TOTAL HOSTS : {{ total_hosts }}"
          - "OK          : {{ total_ok }}"
          - "REBOOT      : {{ total_reboot }}"
          - "ERROR       : {{ total_error }}"
          - "UNREACHABLE : {{ total_unreachable }}"
          - "==============================================="

    - name: Enviar resultado consolidado a n8n
      uri:
        url: "https://n8n.presidencia.gob.ar/webhook/awx-auditoria"
        method: POST
        body_format: json
        validate_certs: false
        return_content: true

        body:
          fecha: "{{ lookup('pipe','date +%F_%T') }}"

          resumen:
            total_hosts: "{{ total_hosts | int }}"
            ok: "{{ total_ok | int }}"
            reboot: "{{ total_reboot | int }}"
            error: "{{ total_error | int }}"
            unreachable: "{{ total_unreachable | int }}"

          servidores: "{{ servidores_awx }}"

      register: webhook_result

    - name: Mostrar respuesta webhook
      debug:
        var: webhook_result.status
