---
########################################################################
# PLAY 1 - AUDITORIA
########################################################################

- name: Auditoria General Linux para Reporte N8N
  hosts: all
  become: true
  gather_facts: false
  ignore_unreachable: true

  tasks:

    - name: Inicializar valores por defecto
      set_fact:
        estado_awx: "UNREACHABLE"
        motivo_awx: "Host no accesible por SSH"
        updates_count: 0
        reboot_pendiente: "No"

    - block:

        - name: Recolectar Facts
          setup:

        - name: Validar Debian Ubuntu
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "SO no soportado (No es Debian/Ubuntu)"
          when:
            - ansible_os_family is not defined or ansible_os_family != "Debian"

        - block:

            - name: Marcar host OK
              set_fact:
                estado_awx: "OK"
                motivo_awx: "Operativo"

            - name: Actualizar cache apt
              command: apt-get update
              changed_when: false

            - name: Detectar actualizaciones
              shell: |
                apt-get --simulate dist-upgrade 2>/dev/null | grep '^Inst ' || true
              register: updates_preview
              changed_when: false
              failed_when: false

            - name: Contar actualizaciones
              set_fact:
                updates_count: "{{ updates_preview.stdout_lines | length | int }}"

            - name: Detectar reinicio pendiente
              stat:
                path: /var/run/reboot-required
              register: reboot_required

            - name: Marcar reboot
              set_fact:
                reboot_pendiente: "Sí"
                estado_awx: "REBOOT"
                motivo_awx: "Reinicio pendiente"
              when:
                - reboot_required.stat.exists | default(false)

          when:
            - estado_awx != "ERROR"

      rescue:

        - name: Registrar error interno
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "{{ ansible_failed_result.msg | default('Error desconocido') }}"

########################################################################
# PLAY 2 - CONSOLIDACION FINAL
########################################################################

- name: Enviar Reporte Final a N8N
  hosts: localhost
  gather_facts: false

  vars:

    servidores_awx: |
      [
      {% for item in groups['all'] %}
      {
        "nombre": "{{ item }}",
        "ip": "{{ hostvars[item].ansible_host | default(item) }}",
        "sistema_operativo": "{{ hostvars[item].ansible_distribution | default('N/D') }}",
        "version": "{{ hostvars[item].ansible_distribution_version | default('N/D') }}",
        "kernel": "{{ hostvars[item].ansible_kernel | default('N/D') }}",
        "updates_pendientes": {{ hostvars[item].updates_count | default(0) | int }},
        "reboot_pendiente": "{{ hostvars[item].reboot_pendiente | default('No') }}",
        "estado": "{{ hostvars[item].estado_awx | default('UNREACHABLE') }}",
        "detalles": "{{ hostvars[item].motivo_awx | default('') }}"
      }{% if not loop.last %},{% endif %}
      {% endfor %}
      ]

  tasks:

    - name: Convertir JSON
      set_fact:
        servidores_finales: "{{ servidores_awx | from_json }}"

    - name: Mostrar payload
      debug:
        var: servidores_finales

    - name: Enviar Webhook N8N
      uri:
        url: "https://n8n.presidencia.gob.ar/webhook/awx-auditoria"
        method: POST
        body_format: json
        validate_certs: false
        timeout: 60
        return_content: true
        body:
          fecha_auditoria: "{{ lookup('pipe', 'date +%Y-%m-%d_%H:%M:%S') }}"
          servidores: "{{ servidores_finales }}"
      register: webhook_result
      failed_when: false

    - name: Resultado webhook
      debug:
        msg:
          - "HTTP {{ webhook_result.status | default('SIN_RESPUESTA') }}"
          - "{{ webhook_result.content | default('SIN_CONTENIDO') }}"
