- name: Mostrar payload final
  debug:
    msg:
      fecha_auditoria: "{{ lookup('pipe', 'date +%Y-%m-%d_%H:%M:%S') }}"
      servidores: "{{ servidores_awx }}"

        - name: Enviar webhook a N8N
          uri:
            url: "https://n8n.presidencia.gob.ar/webhook/awx-auditoria"
            method: POST
            body_format: json
            validate_certs: false
            return_content: true
            timeout: 45
            body:
              fecha_auditoria: "{{ lookup('pipe', 'date +%Y-%m-%d_%H:%M:%S') }}"
              servidores: "{{ servidores_awx }}"
          register: webhook_result
          failed_when: false

        - name: Resultado webhook
          debug:
            msg:
              - "HTTP: {{ webhook_result.status | default('Sin respuesta') }}"
              - "Contenido: {{ webhook_result.content | default('Sin contenido') }}"
