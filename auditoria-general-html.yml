---
########################################################################
# AUDITORIA DE SERVIDORES LINUX
########################################################################

- name: Auditoria General Linux para Reporte N8N
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  ignore_unreachable: true

  tasks:

    - name: Inicializar valores por defecto
      set_fact:
        estado_awx: "UNREACHABLE"
        motivo_awx: "Host no accesible por SSH"
        updates_count: 0
        reboot_pendiente: "No"

    - block:

        - name: Recolectar Facts del Sistema
          setup:

        - name: Validar Distribucion Debian Ubuntu
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "SO no soportado (No es Debian/Ubuntu)"
          when:
            - ansible_os_family is not defined or ansible_os_family != "Debian"

        - block:

            - name: Host accesible y validado
              set_fact:
                estado_awx: "OK"
                motivo_awx: "Operativo"

            - name: Actualizar cache apt
              command: apt-get update
              changed_when: false

            - name: Detectar actualizaciones pendientes
              shell: |
                apt-get --simulate dist-upgrade 2>/dev/null | grep '^Inst ' || true
              register: updates_preview
              changed_when: false
              failed_when: false

            - name: Contar actualizaciones
              set_fact:
                updates_count: "{{ updates_preview.stdout_lines | length }}"

            - name: Detectar reinicio pendiente
              stat:
                path: /var/run/reboot-required
              register: reboot_required

            - name: Marcar reboot pendiente
              set_fact:
                reboot_pendiente: "Sí"
                estado_awx: "REBOOT"
                motivo_awx: "Reinicio pendiente"
              when: reboot_required.stat.exists | default(false)

          when: estado_awx != "ERROR"

      rescue:

        - name: Registrar error interno
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "{{ ansible_failed_result.msg | default('Error desconocido') }}"

########################################################################
# CONSOLIDACION Y ENVIO A N8N
########################################################################

    - name: Consolidar y enviar webhook
      run_once: true
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local

      block:

        - name: Hosts efectivamente procesados por AWX
          set_fact:
            hosts_ejecutados: "{{ ansible_play_hosts_all }}"

        - name: Mostrar hosts procesados
          debug:
            var: hosts_ejecutados

        - name: Construir estructura de servidores
          set_fact:
            servidores_awx: >-
              {% set lista = [] %}
              {% for item in hosts_ejecutados %}
              {% set h = hostvars[item] %}
              {% set _ = lista.append({
                'nombre': item,
                'ip': h.ansible_host | default(item),
                'sistema_operativo': h.ansible_distribution | default('N/D'),
                'version': h.ansible_distribution_version | default('N/D'),
                'kernel': h.ansible_kernel | default('N/D'),
                'updates_pendientes': h.updates_count | default(0) | int,
                'reboot_pendiente': h.reboot_pendiente | default('No'),
                'estado': h.estado_awx | default('UNREACHABLE'),
                'detalles': h.motivo_awx | default('')
              }) %}
              {% endfor %}
              {{ lista }}

        - name: Mostrar JSON generado
          debug:
            var: servidores_awx

        - name: Enviar webhook a N8N
          uri:
            url: "https://n8n.presidencia.gob.ar/webhook/awx-auditoria"
            method: POST
            body_format: json
            validate_certs: false
            return_content: true
            timeout: 45
            body:
              fecha_auditoria: "{{ lookup('pipe', 'date +%Y-%m-%d_%H:%M:%S') }}"
              servidores: "{{ servidores_awx }}"
          register: webhook_result
          failed_when: false

        - name: Resultado webhook
          debug:
            msg:
              - "HTTP: {{ webhook_result.status | default('Sin respuesta') }}"
              - "Contenido: {{ webhook_result.content | default('Sin contenido') }}"
