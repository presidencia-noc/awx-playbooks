---
- name: Auditoria Linux y envio a n8n
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  ignore_unreachable: true

  tasks:

    - name: Inicializar estado
      set_fact:
        estado_awx: "UNREACHABLE"
        motivo_awx: "Host no accesible"
        updates_count: 0

    - block:

        - name: Recolectar facts
          setup:

        - name: Host accesible
          set_fact:
            estado_awx: "OK"
            motivo_awx: ""

        - name: Validar Debian Ubuntu
          meta: end_host
          when:
            - ansible_os_family is defined
            - ansible_os_family != "Debian"

        - name: Actualizar cache apt
          shell: apt-get update
          changed_when: false

        - name: Detectar actualizaciones
          shell: |
            apt-get --simulate dist-upgrade 2>/dev/null | grep '^Inst ' || true
          register: updates_preview
          changed_when: false
          failed_when: false

        - name: Contar updates
          set_fact:
            updates_count: "{{ updates_preview.stdout_lines | length }}"

        - name: Detectar reboot
          stat:
            path: /var/run/reboot-required
          register: reboot_required

        - name: Marcar reboot
          set_fact:
            estado_awx: "REBOOT"
            motivo_awx: "Reinicio pendiente"
          when:
            - reboot_required.stat.exists | default(false)

      rescue:

        - name: Registrar error
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "{{ ansible_failed_result.msg | default('Error no especificado') }}"

########################################################################
# CONSOLIDACION
########################################################################

- name: Consolidar resultados y enviar a n8n
  hosts: "{{ ansible_play_hosts_all[0] }}"
  gather_facts: false
  become: false

  tasks:

    - name: Total OK
      set_fact:
        total_ok: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars)
            | selectattr('estado_awx','equalto','OK')
            | list
            | length
          }}

    - name: Total REBOOT
      set_fact:
        total_reboot: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars)
            | selectattr('estado_awx','equalto','REBOOT')
            | list
            | length
          }}

    - name: Total ERROR
      set_fact:
        total_error: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars)
            | selectattr('estado_awx','equalto','ERROR')
            | list
            | length
          }}

    - name: Total hosts ejecutados
      set_fact:
        total_hosts: "{{ ansible_play_hosts_all | length }}"

    - name: Total unreachable
      set_fact:
        total_unreachable: >-
          {{
            total_hosts | int
            - total_ok | int
            - total_reboot | int
            - total_error | int
          }}

    - name: Inicializar lista
      set_fact:
        servidores_awx: []

    - name: Construir lista
      set_fact:
        servidores_awx: >-
          {{
            servidores_awx +
            [
              {
                'host': item,
                'ip': hostvars[item].ansible_host | default('N/D'),
                'os': (
                  hostvars[item].ansible_distribution | default('N/D')
                ) ~ ' ' ~ (
                  hostvars[item].ansible_distribution_version | default('')
                ),
                'kernel': hostvars[item].ansible_kernel | default('N/D'),
                'updates': hostvars[item].updates_count | default(0),
                'estado': hostvars[item].estado_awx | default('UNREACHABLE'),
                'motivo': hostvars[item].motivo_awx | default('')
              }
            ]
          }}
      loop: "{{ ansible_play_hosts_all }}"

    - name: Mostrar resumen
      debug:
        msg:
          - "TOTAL HOSTS={{ total_hosts }}"
          - "OK={{ total_ok }}"
          - "REBOOT={{ total_reboot }}"
          - "ERROR={{ total_error }}"
          - "UNREACHABLE={{ total_unreachable }}"
          - "SERVIDORES={{ servidores_awx | length }}"

    - name: Verificar DNS n8n
      command: getent hosts n8n.presidencia.gob.ar
      register: dns_result
      changed_when: false
      failed_when: false

    - name: Mostrar DNS
      debug:
        var: dns_result.stdout

    - name: Crear payload
      set_fact:
        payload_n8n:
          fecha: "{{ lookup('pipe','date +%F_%T') }}"
          resumen:
            total_hosts: "{{ total_hosts }}"
            ok: "{{ total_ok }}"
            reboot: "{{ total_reboot }}"
            error: "{{ total_error }}"
            unreachable: "{{ total_unreachable }}"
          servidores: "{{ servidores_awx }}"

    - name: Enviar a n8n por IP
      uri:
        url: "https://172.21.206.41/webhook/awx-auditoria"
        method: POST
        body_format: json
        validate_certs: false
        timeout: 60
        return_content: true
        body: "{{ payload_n8n }}"
      register: webhook_result
      failed_when: false

    - name: Resultado webhook
      debug:
        var: webhook_result
