---
- name: Actualizacion Linux y Reporte Consolidado
  hosts: all
  become: true
  gather_facts: true
  serial: 1
  ignore_unreachable: true

  tasks:

    - name: Inicializar variables
      set_fact:
        estado_awx: "OK"
        motivo_awx: ""
        updates_count: 0

    - name: Omitir sistemas que no utilizan APT
      meta: end_host
      when: ansible_os_family != "Debian"

    - block:

        - name: Actualizar cache
          shell: apt-get update
          register: apt_update
          changed_when: false

        - name: Obtener vista previa
          shell: |
            apt-get --simulate dist-upgrade 2>/dev/null | grep '^Inst ' || true
          register: updates_preview
          changed_when: false
          failed_when: false

        - name: Contar actualizaciones
          set_fact:
            updates_count: "{{ updates_preview.stdout_lines | length }}"

        - name: Ejecutar actualizacion
          shell: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get -y dist-upgrade
          register: upgrade_result
          when: updates_count | int > 0

        - name: Autoremove
          shell: apt-get -y autoremove
          when: updates_count | int > 0

        - name: Autoclean
          shell: apt-get -y autoclean
          when: updates_count | int > 0

        - name: Detectar reinicio requerido
          stat:
            path: /var/run/reboot-required
          register: reboot_required

        - name: Marcar reinicio requerido
          set_fact:
            estado_awx: "REBOOT"
          when:
            - reboot_required.stat.exists | default(false)

      rescue:

        - name: Registrar error
          set_fact:
            estado_awx: "ERROR"
            motivo_awx: "{{ ansible_failed_result.msg | default('Error no especificado') }}"

#################################################################
# REPORTE HTML
#################################################################

- name: Generar Reporte HTML
  hosts: localhost
  gather_facts: false

  vars:
    reporte_html: "/tmp/reporte_actualizaciones_linux.html"

  tasks:

    - name: Generar HTML
      copy:
        dest: "{{ reporte_html }}"
        content: |
          <html>
          <head>
          <meta charset="utf-8">

          <style>

          body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
          }

          table {
            border-collapse: collapse;
            width: 100%;
          }

          th {
            background: #1f4e79;
            color: white;
            padding: 8px;
          }

          td {
            border: 1px solid #cccccc;
            padding: 8px;
          }

          .ok {
            background: #d4edda;
          }

          .reboot {
            background: #fff3cd;
          }

          .error {
            background: #f8d7da;
          }

          .unreachable {
            background: #ffb3b3;
          }

          </style>
          </head>

          <body>

          <h1>Reporte de Actualizaciones Linux</h1>

          <p>
          Fecha:
          {{ lookup('pipe','date "+%Y-%m-%d %H:%M:%S"') }}
          </p>

          <table>

          <tr>
            <th>Hostname</th>
            <th>IP</th>
            <th>Sistema</th>
            <th>Versión</th>
            <th>Kernel</th>
            <th>Python</th>
            <th>Actualizaciones</th>
            <th>Estado</th>
            <th>Motivo</th>
          </tr>

          {% for host in groups['all'] %}

          <tr>

            <td>{{ host }}</td>

            <td>
            {{ hostvars.get(host, {}).get('ansible_host', 'N/D') }}
            </td>

            <td>
            {{ hostvars.get(host, {}).get('ansible_distribution', 'N/D') }}
            </td>

            <td>
            {{ hostvars.get(host, {}).get('ansible_distribution_version', 'N/D') }}
            </td>

            <td>
            {{ hostvars.get(host, {}).get('ansible_kernel', 'N/D') }}
            </td>

            <td>
            {{ hostvars.get(host, {}).get('ansible_python_version', 'N/D') }}
            </td>

            <td>
            {{ hostvars.get(host, {}).get('updates_count', 'N/D') }}
            </td>

            {% if hostvars.get(host, {}).get('estado_awx') == 'OK' %}

              <td class="ok">OK</td>
              <td></td>

            {% elif hostvars.get(host, {}).get('estado_awx') == 'REBOOT' %}

              <td class="reboot">REBOOT</td>
              <td>Reinicio pendiente</td>

            {% elif hostvars.get(host, {}).get('estado_awx') == 'ERROR' %}

              <td class="error">ERROR</td>
              <td>
                {{ hostvars.get(host, {}).get('motivo_awx', '') }}
              </td>

            {% else %}

              <td class="unreachable">
                UNREACHABLE
              </td>

              <td>
                Host inaccesible durante la ejecución (SSH/DNS/Firewall/VPN)
              </td>

            {% endif %}

          </tr>

          {% endfor %}

          </table>

          </body>
          </html>

    - name: Mostrar ubicación
      debug:
        msg: "Reporte generado en {{ reporte_html }}"
