---
- name: Actualizar Linux
  hosts: all
  become: true
  serial: 5

  tasks:

    - name: Actualizar índice APT
      apt:
        update_cache: yes
      register: apt_update

    - name: Mostrar paquetes a actualizar
      shell: |
        apt-get -s dist-upgrade 2>/dev/null | grep '^Inst ' || true
      register: preview
      changed_when: false

    - name: Actualizar paquetes
      apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: upgrade_result

    - name: Verificar reinicio pendiente
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Resumen final
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Actualizacion completada"
          - "Reboot requerido: {{ reboot_required.stat.exists | ternary('SI','NO') }}"
