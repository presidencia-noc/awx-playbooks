---
- name: Actualizacion Linux con vista previa
  hosts: all
  become: true
  gather_facts: true
  serial: 1

  tasks:

    - name: Omitir sistemas que no utilizan APT
      meta: end_host
      when: ansible_os_family != "Debian"

    - name: Actualizar cache APT
      apt:
        update_cache: true
        cache_valid_time: 3600
        update_cache_retries: 3
        update_cache_retry_max_delay: 30
      register: cache_result
      failed_when: false

    - name: Obtener vista previa
      shell: |
        apt-get -s dist-upgrade 2>/dev/null | grep '^Inst ' || true
      register: preview
      changed_when: false
      failed_when: false

    - name: Contar paquetes pendientes
      set_fact:
        updates_count: "{{ preview.stdout_lines | length }}"

    - name: Mostrar vista previa
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "SO: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Paquetes pendientes: {{ updates_count }}"

    - name: Mostrar paquetes que se actualizaran
      debug:
        var: preview.stdout_lines
      when: updates_count | int > 0

    - name: Ejecutar dist-upgrade
      apt:
        upgrade: dist
        autoremove: true
        autoclean: true
        force_apt_get: true
      register: upgrade_result
      when: updates_count | int > 0

    - name: Verificar reinicio pendiente
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Obtener paquetes que requieren reinicio
      shell: cat /var/run/reboot-required.pkgs
      register: reboot_packages
      failed_when: false
      changed_when: false
      when: reboot_required.stat.exists

    - name: Resumen final
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Actualizaciones detectadas: {{ updates_count }}"
          - "Actualizacion ejecutada: {{ 'SI' if updates_count | int > 0 else 'NO' }}"
          - "Cambios realizados: {{ upgrade_result.changed | default(false) }}"
          - "Reinicio requerido: {{ reboot_required.stat.exists | ternary('SI','NO') }}"

    - name: Mostrar paquetes que requieren reinicio
      debug:
        var: reboot_packages.stdout_lines
      when:
        - reboot_required.stat.exists
        - reboot_packages.stdout is defined
