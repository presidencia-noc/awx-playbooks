---
- hosts:
    - INFRA-NS1
    - INFRA-NS2
    - INFRA-NS3
  gather_facts: no

  tasks:
    - name: Mostrar python usado
      raw: which python3 && python3 --version
      register: py

    - debug:
        var: py.stdout_lines

    - name: Probar import apt
      raw: python3 -c 'import apt; print("APT_OK")'
      register: apttest
      ignore_errors: true

    - debug:
        var: apttest
